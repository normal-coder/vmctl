version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: vmctl
    main: ./cmd/vmctl
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X gitee.com/normalcoder/vmctl/internal/cli.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: normal-coder
    name: vmctl

homebrew_casks:
  - name: vmctl
    directory: Casks
    repository:
      owner: normal-coder
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/normal-coder/vmctl
    description: VMware virtual machine control CLI inspired by prlctl, with vmrun and vSphere backends
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/vmctl"]
          end
